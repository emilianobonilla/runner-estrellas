# Versión automática: cada merge a main sube el número de versión solo.
#
#   - Por defecto sube el número del medio:  v1.1.0 → v1.2.0
#   - Si el PR tiene la etiqueta "arreglo":  v1.2.0 → v1.2.1
#   - Si el PR tiene la etiqueta "grande":   v1.2.1 → v2.0.0
#
# Escribe la versión en js/core/version.js (con el título del PR como nombre),
# hace el commit en main, crea la etiqueta vX.Y.Z y una "release" en GitHub, y
# le pide a GitHub Pages que publique de nuevo. Así el cartelito del juego
# siempre muestra la versión real que está en la web.
name: Versión automática

on:
  push:
    branches: [main]

permissions:
  contents: write        # commit + etiqueta + release
  pages: write           # pedir que GitHub Pages publique de nuevo
  pull-requests: read    # leer el título y las etiquetas del PR

# Si se hacen dos merges seguidos, se procesan de a uno (no se pisan los números)
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # El commit que hace esta misma acción no tiene que disparar otra versión
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calcular la versión nueva
        id: calc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ULTIMA=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          ULTIMA=${ULTIMA:-v0.0.0}
          IFS=. read -r MAYOR MENOR ARREGLO <<< "${ULTIMA#v}"

          # PR que trajo este commit (si fue un push directo, no hay)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}' > pr.json
          TITULO=$(jq -r '.title // empty' pr.json)
          NUMERO_PR=$(jq -r '.number // empty' pr.json)
          ETIQUETAS=$(jq -r '[.labels[]?.name] | join(",")' pr.json)
          [ -z "$TITULO" ] && TITULO=$(git log -1 --format=%s)

          case ",$ETIQUETAS," in
            *,grande,*)  NUEVA="$((MAYOR + 1)).0.0" ;;
            *,arreglo,*) NUEVA="$MAYOR.$MENOR.$((ARREGLO + 1))" ;;
            *)           NUEVA="$MAYOR.$((MENOR + 1)).0" ;;
          esac

          echo "$ULTIMA → v$NUEVA · $TITULO"
          {
            echo "numero=$NUEVA"
            echo "pr=$NUMERO_PR"
            echo "titulo<<FIN"; echo "$TITULO"; echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - name: Escribir la versión, commit y etiqueta
        env:
          NUMERO: ${{ steps.calc.outputs.numero }}
          TITULO: ${{ steps.calc.outputs.titulo }}
        run: |
          TZ=America/Montevideo python3 herramientas/poner-version.py "$NUMERO" "$TITULO" "${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/version.js index.html
          git commit -m "Versión $NUMERO — $TITULO"
          git tag -a "v$NUMERO" -m "Versión $NUMERO — $TITULO"
          # Si mientras tanto entró otro commit a main, nos ponemos arriba y reintentamos
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done
          git push origin "v$NUMERO"

      - name: Crear la release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.calc.outputs.numero }}
          TITULO: ${{ steps.calc.outputs.titulo }}
          PR: ${{ steps.calc.outputs.pr }}
        run: |
          NOTAS="Publicada automáticamente al hacer merge a main."
          [ -n "$PR" ] && NOTAS="$NOTAS Cambios: #$PR"
          gh release create "v$NUMERO" --title "v$NUMERO — $TITULO" --notes "$NOTAS"

      - name: Publicar de nuevo en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # Los commits hechos por esta acción no siempre disparan Pages solos
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación (Pages la hará con el próximo push)."
