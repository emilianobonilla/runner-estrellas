<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Runner de Estrellas</title>
  <!-- Pantalla completa como app: en iPhone/iPad se logra con Compartir → "Agregar a pantalla de inicio" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runner">
  <meta name="theme-color" content="#0f1420">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icono-180.png">
  <link rel="icon" type="image/svg+xml" href="assets/img/icono.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="escenario">
      <div id="marco">
        <canvas id="juego" width="960" height="528"></canvas>

        <!-- Marcador durante la partida -->
        <div id="hud" class="oculto">
          <span class="hud-item" title="Estrellas">⭐ <b id="hud-estrellas">0/0</b></span>
          <span class="hud-item" title="Puntos">🏆 <b id="hud-puntos">0</b></span>
          <span class="hud-item" title="Vidas">❤️ <b id="hud-vidas">3</b></span>
          <span class="hud-item" title="Tiempo">⏱ <b id="hud-tiempo">0:00.0</b></span>
          <span class="hud-item hud-nombre" id="hud-nombre"></span>
          <button id="hud-fs" class="hud-boton oculto" title="Pantalla completa">⛶</button>
          <button id="hud-pausa" class="hud-boton" title="Pausa (Esc)">⏸</button>
        </div>

        <!-- Controles táctiles -->
        <div id="touch" class="oculto">
          <div class="touch-grupo izquierda">
            <button class="touch-boton" data-tecla="izq" aria-label="Izquierda">◀</button>
            <button class="touch-boton" data-tecla="der" aria-label="Derecha">▶</button>
          </div>
          <div class="touch-grupo derecha">
            <button class="touch-boton grande" data-tecla="salto" aria-label="Saltar">▲</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pantallas (menú, selección, resultados, etc.) -->
    <div id="pantallas"></div>
  </div>

  <!-- Núcleo -->
  <script src="js/core/util.js"></script>
  <script src="js/core/fullscreen.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/storage.js"></script>

  <!-- Datos: temas, mundos, personajes y niveles (agregá aquí los nuevos).
       Los niveles van agrupados por mundo: cada mundo comparte estética. -->
  <script src="data/themes.js"></script>
  <script src="data/worlds.js"></script>
  <script src="data/characters.js"></script>
  <!-- Mundo 1: Prado Soleado -->
  <script src="data/levels/nivel-01-prado.js"></script>
  <script src="data/levels/nivel-02-prado.js"></script>
  <!-- Mundo 2: Cuevas Profundas -->
  <script src="data/levels/nivel-03-cueva.js"></script>
  <script src="data/levels/nivel-04-cueva.js"></script>
  <!-- Mundo 3: Costa Dorada -->
  <script src="data/levels/nivel-05-playa.js"></script>
  <script src="data/levels/nivel-06-playa.js"></script>
  <!-- Mundo 4: Tierra del Volcán -->
  <script src="data/levels/nivel-07-volcan.js"></script>
  <script src="data/levels/nivel-08-volcan.js"></script>
  <!-- Mundo 5: Castillo de las Estrellas -->
  <script src="data/levels/nivel-09-castillo.js"></script>
  <script src="data/levels/nivel-10-castillo.js"></script>

  <!-- Juego -->
  <script src="js/game/level.js"></script>
  <script src="js/game/entities.js"></script>
  <script src="js/game/player.js"></script>
  <script src="js/game/render.js"></script>
  <script src="js/game/partida.js"></script>

  <!-- Carrera entre dos dispositivos (WebRTC). Solo este modo usa internet. -->
  <script src="js/vendor/peerjs.min.js"></script>
  <script src="js/net/red.js"></script>
  <script src="js/net/carrera.js"></script>

  <!-- Interfaz -->
  <script src="js/ui/screens.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
